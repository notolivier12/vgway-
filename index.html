<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VGway | Photographic slices of our life</title>
<meta name="description" content="Photographic slices of our life">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://vgway.com/">
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<meta property="og:title" content="VGway | Photographic slices of our life">
<meta property="og:description" content="Photographic slices of our life">
<meta property="og:image" content="https://vgway.com/vg1.jpg">
<style>
  html, body { margin: 0; height: 100%; background: #0c0c0c; color: #f4f1ec; font-family: Georgia, "Times New Roman", serif; }
  main { position: fixed; inset: 0; overflow: hidden; }
  .h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1800ms ease-in-out; }
  .slide.on { opacity: 1; }
  .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0) 55%, rgba(0,0,0,.72) 100%); }
  header { position: absolute; top: 0; left: 0; right: 0; padding: 28px clamp(20px, 4vw, 56px); }
  header a { color: inherit; text-decoration: none; font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 20px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; }
  figure { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 0 clamp(20px, 6vw, 96px) clamp(32px, 7vh, 72px); text-align: center; }
  blockquote { margin: 0 auto; max-width: 820px; font-size: clamp(18px, 2.4vw, 30px); line-height: 1.45; font-style: italic; text-shadow: 0 2px 18px rgba(0,0,0,.55); }
  figcaption { margin-top: 14px; font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 13px; letter-spacing: .22em; text-transform: uppercase; opacity: .85; }
  @media (prefers-reduced-motion: reduce) { .slide { transition: none; } }
</style>
</head>
<body>
<main>
  <h1 class="h1">VGway: photographic slices of our life</h1>
  <img class="slide on" src="vg1.jpg" alt="An island with a green mountain seen from above, surrounded by turquoise lagoon">
  <img class="slide" src="vg2.jpg" alt="A glass house and pool above the clouds at sunset">
  <img class="slide" src="vg3.jpg" alt="Sailboats reflected in a calm harbour at night">
  <div class="shade" aria-hidden="true"></div>
  <header><a href="/">VGway</a></header>
  <figure>
    <blockquote>You are forgiven for your happiness and your successes only if you generously consent to share them.</blockquote>
    <figcaption>Albert Camus</figcaption>
  </figure>
</main>
<script>
  (function () {
    var slides = document.querySelectorAll(".slide");
    if (slides.length < 2) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var i = 0;
    setInterval(function () {
      slides[i].classList.remove("on");
      i = (i + 1) % slides.length;
      slides[i].classList.add("on");
    }, 7000);
  })();
</script>
</body>
</html>
